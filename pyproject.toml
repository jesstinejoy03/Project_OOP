[project]
name = "mood-journal"
version = "1.0.0"
description = "Mood Journal & Coping Companion - a Tkinter + scikit-learn journalling app (CSC 2102 OOP assignment)"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
voice = ["SpeechRecognition>=3.10"]
dataset = ["datasets>=2.14"]
dev = ["ruff>=0.4", "mypy>=1.8"]

[project.scripts]
mood-journal = "main:main"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",   # long lines are checked by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
"ml/train_model.py" = ["E402"]   # sys.path bootstrap has to happen before the imports

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
